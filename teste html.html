<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia PDS</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Sistema da Barbearia</h1>
    <h2>Cadastro de Usuário</h2>

    <form id="formCadastro">
        <div>
            <label>Nome:</label><br>
            <input type="text" id="nome" required>
        </div>
        <br>
        <div>
            <label>E-mail:</label><br>
            <input type="email" id="email" required>
        </div>
        <br>
        <div>
            <label>Senha:</label><br>
            <input type="password" id="senha" required>
        </div>
        <br>
        <div>
            <label>Tipo:</label><br>
            <select id="Tipo">
                <option value="cliente">Cliente</option>
                <option value="barbeiro">Barbeiro</option>
            </select>
        </div>
        <br>
        <div id="campoCodigo" style="display: none;">
            <label>Código de Acesso:</label><br>
            <input type="text" id="codigoAcesso">
        </div>
        <br>
        <button type="submit">Cadastrar</button>
    </form>

    <div id="mensagem" style="margin-top: 15px; font-weight: bold;"></div>
</body>
</html>
